name: PR

# Rules for the PR text and target. Separate from CI because it must also run
# when the PR is edited: a title, body or base changed after a green check has
# to be checked again, and CI does not run on "edited".
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  text:
    name: PR text
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # compares the branch with main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # PR text goes in through env, never interpolated into the script (command
      # injection). FORBIDDEN_TERMS comes from an optional secret. That is why
      # the checker that runs here is the one on main, already reviewed, and not
      # the one in the PR: a PR that changed the script could leak the secret.
      - name: PR target, commit messages, title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.base_ref }}
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
          BASE: origin/${{ github.base_ref }}
        run: |
          git show origin/main:tools/check-commits.ts > "$RUNNER_TEMP/check-commits.ts"
          node "$RUNNER_TEMP/check-commits.ts" "$BASE"
